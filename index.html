<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Who Are You?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="theme-toggle">🌙 / ☀️</button>

<div class="container">

  <!-- Welcome Screen -->
  <div id="welcome-screen" class="screen active">
    <h1>Ready for the Survey?</h1>
    <p>Answer various questions to see who you are</p>
    <button id="start-btn">Start</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen">
    <h2 id="question-text"></h2>
    <div class="btn-group">
      <button id="yes-btn">Yes</button>
      <button id="no-btn">No</button>
    </div>
    <button id="undo-btn" class="undo-btn" disabled>↩ Undo</button>
  </div>

  <!-- Calibrating Screen -->
  <div id="calibrating-screen" class="screen">
    <h1 id="calibrate-text">Calibrating...</h1>
    <div class="loader"></div>
    <p id="calibrate-sub">Please wait</p>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <h1 id="result-title">You are...</h1>
    <div id="results-container"></div>
    <button id="restart-btn">Try Again</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
