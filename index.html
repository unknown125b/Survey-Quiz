<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Are You?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="theme-toggle" type="button">🌙 / ☀️</button>

<div class="container">

  <div id="welcome-screen" class="screen active">
    <h1>Ready for the Survey?</h1>
    <p>Answer various questions to see who you are</p>
    <button id="start-btn" type="button">Start</button>
  </div>

  <div id="quiz-screen" class="screen">
    <h2 id="question-text"></h2>
    <div class="btn-group">
      <button id="yes-btn" type="button">Yes</button>
      <button id="no-btn" type="button">No</button>
    </div>
    <button id="undo-btn" class="undo-btn" type="button" disabled>↩ Undo</button>
  </div>

  <div id="calibrating-screen" class="screen">
    <h1 id="calibrate-text">Calibrating...</h1>
    <div class="loader"></div>
    <p id="calibrate-sub">Please wait</p>
  </div>

  <!-- NEW: scary identity check -->
  <div id="identity-screen" class="screen">
    <img id="scary-img" src="Scary.png" alt="Scary">
    <h2 id="identity-question"></h2>
    <div class="btn-group">
      <button id="identity-yes-btn" type="button">Yes</button>
      <button id="identity-no-btn" type="button">No</button>
    </div>
  </div>

  <div id="result-screen" class="screen">
    <h1 id="result-title">You are...</h1>
    <div id="results-container"></div>
    <button id="restart-btn" type="button">Try Again</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
